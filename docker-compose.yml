services:
  db:
    image: postgres:16-alpine
    container_name: forr_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: forr
      POSTGRES_PASSWORD: forr_dev
      POSTGRES_DB: forr_db
    volumes:
      - forr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forr -d forr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forr_pgdata:
